[project]
name = "voice-ai"
version = "0.1.0"
description = "RAG-powered voice assistant: retrieval + generation over ChromaDB, Deepgram TTS/STT, React frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "python-dotenv==1.2.2",
    "deepgram-sdk==6.0.0",
    "chromadb>=0.5,<1.0",
    "sentence-transformers==5.6.1",
    "transformers==5.14.1",
    "torch==2.13.0",
    "requests==2.34.2",
    "cachetools>=5.5,<6.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "locust>=2.31",
    "qdrant-client==1.18.0",  # only needed to run scripts/migrate_qdrant_to_chroma.py once
]

[tool.uv]
package = false
