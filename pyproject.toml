[project]
name = "voice-ai"
version = "0.1.0"
description = "RAG-powered voice assistant: retrieval + generation over ChromaDB, Deepgram TTS/STT, React frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "python-dotenv==1.2.2",
    "deepgram-sdk==6.0.0",
    "chromadb>=0.5,<1.0",
    "sentence-transformers==5.6.1",
    # Pinned to the 4.x line (not 5.x) specifically because optimum-onnx
    # 0.1.0 declares "transformers<4.58.0,>=4.36" — it doesn't support
    # transformers 5.x at all yet. 4.57.6 is the newest release inside that
    # window, and still satisfies sentence-transformers' own >=4.41 floor.
    "transformers==4.57.6",
    "torch==2.13.0",
    "requests==2.34.2",
    "cachetools>=5.5,<6.0",
    "python-multipart>=0.0.9",
    # ONNX export/runtime for the reranker + generation models (see
    # rag_functions.py) — declared here (with the onnxruntime extra, which
    # pulls in optimum-onnx + onnxruntime together) so `uv run` manages it
    # instead of fighting an untracked pip-installed copy on every launch.
    "optimum[onnxruntime]==2.1.0",
]

[dependency-groups]
dev = [
    "locust>=2.31",
    "qdrant-client==1.18.0",  # only needed to run scripts/migrate_qdrant_to_chroma.py once
]

[tool.uv]
package = false
