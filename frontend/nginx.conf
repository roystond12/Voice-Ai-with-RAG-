server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # onnxruntime-web's WASM glue files are .mjs — make sure they're served
    # with a JS mime type regardless of the base nginx:alpine mime.types version.
    types {
        application/javascript mjs;
        application/wasm wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
